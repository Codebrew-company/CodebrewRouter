name: .NET CI

on:
  push:
    branches: [master, task/latest-changeset]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet format
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" HEAD -- '*.cs')
          else
            mapfile -t CHANGED_FILES < <(git ls-files '*.cs')
          fi

          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "No C# files changed; skipping dotnet format."
            exit 0
          fi

          dotnet format --verify-no-changes --no-restore --include "${CHANGED_FILES[@]}"
