<svg width="100%" viewBox="0 0 680 690" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CodebrewRouter request flow with fusion branch</title>
<desc>A client request reaches the endpoint, then ModelSelectionResolver splits: model=fusion goes to FusionChatClient which fans out to parallel proposers and streams an aggregator synthesis; every other model goes to the CodebrewRouter single-model pipeline. Fusion bypasses back to CodebrewRouter when tools are present, fewer than two proposers succeed, or fusion is disabled.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.box{fill:#fff;stroke:#888;stroke-width:0.5}
.purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.arr{stroke:#888;stroke-width:1.5;fill:none}
text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
</style>
</defs>

<rect class="gray" x="250" y="40" width="180" height="46" rx="4"/><text class="th" x="340" y="60" text-anchor="middle">Your app</text><text class="ts" x="340" y="76" text-anchor="middle">model = fusion | auto | ...</text>
<line class="arr" x1="340" y1="86" x2="340" y2="110" marker-end="url(#arrow)"/>

<rect class="gray" x="220" y="114" width="240" height="46" rx="4"/><text class="th" x="340" y="134" text-anchor="middle">ChatCompletionsEndpoint</text><text class="ts" x="340" y="150" text-anchor="middle">parse, admin guard, SSE</text>
<line class="arr" x1="340" y1="160" x2="340" y2="184" marker-end="url(#arrow)"/>

<rect class="gray" x="220" y="188" width="240" height="46" rx="4"/><text class="th" x="340" y="208" text-anchor="middle">ModelSelectionResolver</text><text class="ts" x="340" y="224" text-anchor="middle">fusion? split</text>

<line class="arr" x1="280" y1="234" x2="190" y2="270" marker-end="url(#arrow)"/>
<line class="arr" x1="400" y1="234" x2="490" y2="270" marker-end="url(#arrow)"/>

<rect class="purple" x="70" y="274" width="240" height="48" rx="4"/><text class="th" x="190" y="294" text-anchor="middle">FusionChatClient</text><text class="ts" x="190" y="310" text-anchor="middle">MoA-Lite, model = fusion</text>

<rect class="blue" x="380" y="274" width="240" height="48" rx="4"/><text class="th" x="500" y="294" text-anchor="middle">CodebrewRouterChatClient</text><text class="ts" x="500" y="310" text-anchor="middle">clean, classify, fallback chain</text>

<line class="arr" x1="190" y1="322" x2="190" y2="348" marker-end="url(#arrow)"/>
<rect class="purple" x="70" y="352" width="240" height="44" rx="4"/><text class="th" x="190" y="371" text-anchor="middle">Classify + pick sets</text><text class="ts" x="190" y="387" text-anchor="middle">top-3 proposers, aggregator</text>

<line class="arr" x1="190" y1="396" x2="190" y2="422" marker-end="url(#arrow)"/>
<rect class="purple" x="55" y="426" width="270" height="52" rx="4" stroke-dasharray="4 3"/><text class="th" x="190" y="447" text-anchor="middle">Parallel proposer fan-out</text><text class="ts" x="190" y="463" text-anchor="middle">K-of-N soft deadline</text>

<line class="arr" x1="190" y1="478" x2="190" y2="504" marker-end="url(#arrow)"/>
<rect class="purple" x="70" y="508" width="240" height="48" rx="4"/><text class="th" x="190" y="528" text-anchor="middle">Aggregator (streamed)</text><text class="ts" x="190" y="544" text-anchor="middle">MoA synthesis prompt</text>

<line class="arr" x1="190" y1="556" x2="190" y2="600" marker-end="url(#arrow)"/>

<line class="arr" x1="310" y1="452" x2="378" y2="360" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="410" text-anchor="middle">bypass</text>

<line class="arr" x1="500" y1="322" x2="500" y2="600" marker-end="url(#arrow)"/>
<rect class="blue" x="380" y="430" width="240" height="44" rx="4"/><text class="th" x="500" y="449" text-anchor="middle">Keyed provider</text><text class="ts" x="500" y="465" text-anchor="middle">first-chunk probe failover</text>

<rect class="teal" x="250" y="604" width="180" height="46" rx="4"/><text class="th" x="340" y="624" text-anchor="middle">SSE response</text><text class="ts" x="340" y="640" text-anchor="middle">streamed to client</text>

<rect x="55" y="662" width="10" height="10" rx="2" class="purple"/><text class="ts" x="71" y="671">fusion path</text>
<rect x="160" y="662" width="10" height="10" rx="2" class="blue"/><text class="ts" x="176" y="671">single-model path</text>
<rect x="310" y="662" width="10" height="10" rx="2" class="teal"/><text class="ts" x="326" y="671">output</text>
</svg>
