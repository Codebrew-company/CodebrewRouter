.blue{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.5}
.purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.coral{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}
.dash{fill:none;stroke:#888;stroke-width:0.5;stroke-dasharray:5 4}
text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.lbl{font-size:12px;fill:#5F5E5A}
</style>
</defs>

