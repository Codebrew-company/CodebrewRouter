<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CodebrewRouter project and layer architecture</title>
<desc>The API host exposes the OpenAI-compatible endpoint and admin guard; Infrastructure holds the routing pipeline, fusion client, strategies and keyed providers; Core holds options and domain types; AppHost wires Aspire and secrets; ServiceDefaults holds shared telemetry. Keyed providers fan out to cloud, LAN, and local backends, with Ollama and the Hermes fleet as external systems.</desc>
<defs>
